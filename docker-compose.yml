services:
  postgres:
    image: postgres:15
    container_name: core-banking-db
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - core-banking-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: core-banking-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: cho process chạy trực tiếp trên host (mvn spring-boot:run, test suite) - giữ nguyên
      # PLAINTEXT_HOST: cho client chạy TRONG container/Pod (Docker Desktop K8s), advertise qua
      # host.docker.internal vì "localhost" bên trong container là chính nó, không phải máy host
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  redis:
    image: redis:7-alpine
    container_name: core-banking-redis
    ports:
      - "6380:6379"

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: core-banking-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: core_banking
      APP_USER_PASSWORD: core_banking
    ports:
      - "1522:1521"
    volumes:
      - core-banking-oracle-data:/opt/oracle/oradata

volumes:
  core-banking-data:
  core-banking-oracle-data: