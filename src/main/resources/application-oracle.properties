# Spring Profile "oracle" - kích hoạt bằng --spring.profiles.active=oracle
# Chạy song song với Postgres (profile mặc định), không thay thế.
# Yêu cầu: docker compose up -d oracle (xem docker-compose.yml, service "oracle")

spring.datasource.url=jdbc:oracle:thin:@localhost:1522/FREEPDB1
spring.datasource.username=core_banking
spring.datasource.password=core_banking
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
