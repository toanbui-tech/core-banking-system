# Profile mặc định - PostgreSQL. Chạy song song với Oracle (profile "oracle",
# xem application-oracle.properties), không thay thế. Xem README.md để biết
# cách chạy/test theo từng profile.
spring.application.name=core-banking-system

spring.datasource.url=jdbc:postgresql://localhost:5434/core_banking?timezone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

outbox.publisher.fixed-delay-ms=5000

spring.data.redis.host=localhost
spring.data.redis.port=6380

app.cache.balance.ttl-seconds=3600