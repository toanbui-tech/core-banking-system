# DB credentials - tách khỏi Deployment/ConfigMap, không hardcode trong YAML app.
#
# LƯU Ý: đây là credentials dev-only, giống hệt giá trị đã public sẵn trong
# application.properties/docker-compose.yml của repo này (chỉ để chạy Postgres local
# cho mục đích portfolio/demo) - không phải secret thật cần bảo vệ. Commit file này vào
# git là CHẤP NHẬN ĐƯỢC ở phạm vi dự án này, nhưng KHÔNG phải cách làm cho production.
# Trong hệ thống thật: không commit Secret vào git, tạo trực tiếp qua
# `kubectl create secret generic ... --from-literal=...`, hoặc dùng công cụ quản lý
# secret chuyên dụng (Vault, External Secrets Operator, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: core-banking-secret
  namespace: core-banking
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "postgres"
